# 控制是否以及如何将依赖项添加到默认目录中
catalogMode: prefer

# 是否忽略向工作区根目录添加依赖时的警告提示
ignoreWorkspaceRootCheck: true

# npm 包注册表的基本 URL（包括尾部斜杠）
registry: https://registry.npmmirror.com/
registries:
  default: https://registry.npmmirror.com/

# 定义了版本发布后 pnpm 安装之前必须经过的最少分钟数
minimumReleaseAge: 0
# 是否强制提升所有依赖
shamefullyHoist: true

# 在执行脚本时使用POSIX shell模拟器替代系统原生shell
shellEmulator: true

# 用于控制是否严格检查对等依赖（peer dependencies）的版本一致性。
# 当设置为 true 时，pnpm 会强制安装指定版本的对等依赖；
# 设置为 false 时，会忽略版本不一致的警告
strictPeerDependencies: false

# 当设置为“禁止降级”时，如果软件包的信任级别较之前的版本有所降低，pnpm 将无法安装
trustPolicy: no-downgrade

# 列出一个或多个 pnpm 应该允许安装的特定软件包或版本，即使这些软件包不满足信任策略要求。
trustPolicyExclude:
  - semver
  - chokidar
  - cached-factory

catalogs:
  dev:
    '@lincy/unocss-base-config': ^2.7.1
    '@vitejs/plugin-vue': ^6.0.7
    '@vitejs/plugin-vue-jsx': ^5.1.5
    '@vue-macros/volar': ^3.1.2
    baseline-browser-mapping: ^2.10.31
    cross-env: ^10.1.0
    mockjs: ^1.1.0
    nodemon: ^3.1.14
    postcss: ^8.5.15
    postcss-px-to-viewport-8-plugin: ^1.2.5
    sass-embedded: ^1.100.0
    tsup: ^8.5.1
    tsx: ^4.22.3
    typescript: ^5.9.3
    unocss: ^66.7.0
    unplugin-auto-import: ^21.0.0
    unplugin-vue-components: ^32.1.0
    vite: ^8.0.14
    vite-plugin-inspect: ^11.3.3
    vite-plugin-mock: ^3.0.2
    vite-plugin-progress: ^0.0.7
    vue-macros: ^3.1.2
    vue-tsc: ^3.3.1

  lint:
    '@lincy/eslint-config': ^7.2.0
    '@lincy/stylelint-config': ^2.2.2
    '@unocss/eslint-plugin': ^66.7.0
    eslint: ^10.4.0
    stylelint: ^17.12.0

  prod:
    '@lincy/utils': ^0.7.3
    '@unhead/ssr': ^3.1.0
    '@unhead/vue': ^3.1.0
    '@vue/server-renderer': ^3.5.34
    '@vueuse/core': ^14.3.0
    axios: ^1.16.1
    compression: ^1.8.1
    cookie-parser: ^1.4.7
    ejs: ^5.0.2
    express: ^5.2.1
    http-proxy-middleware: ^4.0.0
    lodash: ^4.18.1
    lru-cache: ^11.5.0
    md5: ^2.3.0
    morgan: ^1.10.1
    pinia: ^3.0.4
    qs: ^6.15.2
    request-ip: ^3.3.0
    serve-static: ^2.2.1
    store2: ^2.14.4
    vant: ^4.9.24
    vue: ^3.5.34
    vue-router: ^5.0.7

  types:
    '@types/compression': ^1.8.1
    '@types/cookie-parser': ^1.4.10
    '@types/ejs': ^3.1.5
    '@types/express': ^5.0.6
    '@types/morgan': ^1.9.10
    '@types/node': ^25.9.1
    '@types/request-ip': ^0.0.41
onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - vue-demi
peerDependencyRules:
  ignoreMissing:
    - rollup
    - esbuild
    - postcss
    - prettier
allowBuilds:
  esbuild: true
  oxc-resolver: true
